<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store24 - Товары</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    padding:30px;
    margin:0;
}

.container{
    max-width:1200px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

h1{
    margin-top:0;
}

input{
    padding:10px;
    margin:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
    background:#2563eb;
}

button:hover{
    opacity:0.9;
}

.delete-btn{
    background:#dc2626;
}

.edit-btn{
    background:#f59e0b;
}

.back-btn{
    background:#6b7280;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

th{
    background:#2563eb;
    color:white;
}

</style>
</head>
<body>

<div class="container">

<div class="card">

<h1>Товары магазина "24"</h1>

<a href="index.html">
<button class="back-btn">
На главную
</button>
</a>

</div>

<div class="card">

<h2>Добавление товара</h2>

<input type="text" id="name" placeholder="Название">

<input type="text" id="category" placeholder="Категория">

<input type="text" id="supplier" placeholder="Поставщик">

<input type="number" id="price" placeholder="Цена">

<input type="number" id="quantity" placeholder="Количество">

<button onclick="addProduct()">
Добавить товар
</button>

</div>

<div class="card">

<h2>Поиск</h2>

<input
type="text"
id="search"
placeholder="Поиск по названию"
onkeyup="loadProducts()"
>

<button onclick="loadProducts()">
Обновить таблицу
</button>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>Название</th>
<th>Категория</th>
<th>Поставщик</th>
<th>Цена</th>
<th>Количество</th>
<th>Действия</th>
</tr>
</thead>

<tbody id="productsTable">

</tbody>

</table>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
deleteDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbem9e3uL0H5JtbFrM8q_5xK8mz-5VcDI",
  authDomain: "store24-5c657.firebaseapp.com",
  projectId: "store24-5c657",
  storageBucket: "store24-5c657.firebasestorage.app",
  messagingSenderId: "524366256106",
  appId: "1:524366256106:web:2aff7066afabc4ccc58493"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addProduct = async () => {

    const name =
        document.getElementById("name").value;

    const category =
        document.getElementById("category").value;

    const supplier =
        document.getElementById("supplier").value;

    const price =
        Number(document.getElementById("price").value);

    const quantity =
        Number(document.getElementById("quantity").value);

    if(!name){
        alert("Введите название товара");
        return;
    }

    await addDoc(
        collection(db,"products"),
        {
            name,
            category,
            supplier,
            price,
            quantity
        }
    );

    document.getElementById("name").value = "";
    document.getElementById("category").value = "";
    document.getElementById("supplier").value = "";
    document.getElementById("price").value = "";
    document.getElementById("quantity").value = "";

    loadProducts();

};

window.deleteProduct = async (id) => {

    if(!confirm("Удалить товар?")){
        return;
    }

    await deleteDoc(
        doc(db,"products",id)
    );

    loadProducts();

};

window.editProduct = async (id,currentName) => {

    const newName =
        prompt(
            "Новое название товара",
            currentName
        );

    if(!newName){
        return;
    }

    await updateDoc(
        doc(db,"products",id),
        {
            name:newName
        }
    );

    loadProducts();

};

window.loadProducts = async () => {

    const table =
        document.getElementById("productsTable");

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    table.innerHTML = "";

    const querySnapshot =
        await getDocs(
            collection(db,"products")
        );

    querySnapshot.forEach((document)=>{

        const p = document.data();

        if(
            search &&
            !p.name.toLowerCase().includes(search)
        ){
            return;
        }

        table.innerHTML += `
        <tr>

            <td>${p.name}</td>
            <td>${p.category}</td>
            <td>${p.supplier}</td>
            <td>${p.price}</td>
            <td>${p.quantity}</td>

            <td>

                <button
                class="edit-btn"
                onclick="editProduct('${document.id}','${p.name}')">
                Изменить
                </button>

                <button
                class="delete-btn"
                onclick="deleteProduct('${document.id}')">
                Удалить
                </button>

            </td>

        </tr>
        `;
    });

};

loadProducts();

</script>

</body>
</html>
