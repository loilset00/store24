<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store24 - Товары</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1300px;
    margin:auto;
}

.header{
    background:linear-gradient(135deg,#2563eb,#1e40af);
    color:white;
    padding:30px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

.header h1{
    margin:0;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.stat-number{
    font-size:36px;
    font-weight:bold;
    color:#2563eb;
}

input{
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin:5px;
}

button{
    padding:12px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    margin:5px;
}

.add-btn{
    background:#2563eb;
}

.edit-btn{
    background:#f59e0b;
}

.delete-btn{
    background:#dc2626;
}

.back-btn{
    background:#6b7280;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:left;
}

th{
    background:#2563eb;
    color:white;
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    input{
        width:100%;
        margin-bottom:10px;
	select{
    		padding:12px;
    		border:1px solid #ccc;
    		border-radius:8px;
    		margin:5px;
	}
    }

    button{
        width:100%;
        margin-bottom:10px;
    }

    .header{
        padding:20px;
    }

    .header h1{
        font-size:24px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>📦 Управление товарами</h1>

<p>Учёт товаров магазина «24»</p>

<a href="index.html">
<button class="back-btn">
← На главную
</button>
</a>

</div>

<div class="stats">

<div class="stat-card">
<div class="stat-number" id="productsCount">0</div>
<div>Товаров</div>
</div>

<div class="stat-card">
<div class="stat-number" id="stockCount">0</div>
<div>Общий остаток</div>
</div>

</div>

<div class="card">

<h2>Добавление товара</h2>

<input type="text" id="name" placeholder="Название">

<select id="category"></select>

<select id="supplier"></select>

<input type="number" id="price" placeholder="Цена">

<input type="number" id="quantity" placeholder="Количество">

<button class="add-btn" onclick="addProduct()">
Добавить товар
</button>

</div>

<div class="card">

<h2>Поиск</h2>

<input
type="text"
id="search"
placeholder="Поиск по названию, категории или поставщику"
onkeyup="loadProducts()"
>

<select id="categoryFilter" onchange="loadProducts()">

<option value="">
Все категории
</option>

</select>

</div>

<div class="card">

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>Название</th>
<th>Категория</th>
<th>Поставщик</th>
<th>Цена</th>
<th>Количество</th>
<th>Статус</th>
<th>Действия</th>
</tr>
</thead>

<tbody id="productsTable">

</tbody>

</table>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
deleteDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbem9e3uL0H5JtbFrM8q_5xK8mz-5VcDI",
  authDomain: "store24-5c657.firebaseapp.com",
  projectId: "store24-5c657",
  storageBucket: "store24-5c657.firebasestorage.app",
  messagingSenderId: "524366256106",
  appId: "1:524366256106:web:2aff7066afabc4ccc58493"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let categoriesList = [];

async function loadCategories(){

    const select =
        document.getElementById("category");

    select.innerHTML = "";

    const querySnapshot =
        await getDocs(
            collection(db,"categories")
        );

    querySnapshot.forEach((document)=>{

        const category =
            document.data();

        select.innerHTML += `
            <option value="${category.name}">
                ${category.name}
            </option>
        `;

    });

}

async function loadSuppliers(){

    const select =
        document.getElementById("supplier");

    select.innerHTML = "";

    const querySnapshot =
        await getDocs(
            collection(db,"suppliers")
        );

    querySnapshot.forEach((document)=>{

        const supplier =
            document.data();

        select.innerHTML += `
            <option value="${supplier.name}">
                ${supplier.name}
            </option>
        `;

    });

}

async function loadCategoryFilter(){

    const select =
        document.getElementById("categoryFilter");

    const querySnapshot =
        await getDocs(
            collection(db,"categories")
        );

    querySnapshot.forEach((document)=>{

        const category =
            document.data();

        select.innerHTML += `
            <option value="${category.name}">
                ${category.name}
            </option>
        `;

    });

}

window.addProduct = async () => {

    const name = document.getElementById("name").value;
    const category = document.getElementById("category").value;
    const supplier = document.getElementById("supplier").value;
    const price = Number(document.getElementById("price").value);
    const quantity = Number(document.getElementById("quantity").value);

    if(!name){
        alert("Введите название товара");
        return;
    }

    await addDoc(
        collection(db,"products"),
        {
            name,
            category,
            supplier,
            price,
            quantity
        }
    );

    document.getElementById("name").value="";
    document.getElementById("category").value="";
    document.getElementById("supplier").value="";
    document.getElementById("price").value="";
    document.getElementById("quantity").value="";

    loadProducts();

};

window.deleteProduct = async (id) => {

    if(!confirm("Удалить товар?")) return;

    await deleteDoc(
        doc(db,"products",id)
    );

    loadProducts();

};

window.editProduct = async (id,p) => {

    const name =
        prompt("Название",p.name);

    if(name===null) return;

    const category =
        prompt("Категория",p.category);

    const supplier =
        prompt("Поставщик",p.supplier);

    const price =
        prompt("Цена",p.price);

    const quantity =
        prompt("Количество",p.quantity);

    await updateDoc(
        doc(db,"products",id),
        {
            name,
            category,
            supplier,
            price:Number(price),
            quantity:Number(quantity)
        }
    );

    loadProducts();

};

window.loadProducts = async () => {

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const categoryFilter =
    	document
    	.getElementById("categoryFilter")
    	.value;

    const table =
        document.getElementById("productsTable");

    table.innerHTML="";

    let totalStock = 0;

    const querySnapshot =
        await getDocs(
            collection(db,"products")
        );

    const products = [];

    querySnapshot.forEach((document)=>{

        products.push({
            id:document.id,
            ...document.data()
        });

    });

    products.reverse();

    products.forEach((p)=>{

    totalStock += Number(p.quantity || 0);

    const searchText =
        `${p.name} ${p.category} ${p.supplier}`
        .toLowerCase();

    if(search && !searchText.includes(search))
        return;

    if(
        categoryFilter &&
        p.category !== categoryFilter
    ){
        return;
    }

    table.innerHTML += `
        <tr>

        <td>${p.name}</td>
        <td>${p.category}</td>
        <td>${p.supplier}</td>
        <td>${p.price}</td>
        <td>

	<span style="
	font-weight:bold;
	color:
	${
	Number(p.quantity)<=0
	? '#dc2626'
	: Number(p.quantity)<=10
	? '#f59e0b'
	: '#16a34a'
	}
	">

	${p.quantity}

	</span>

	</td>

	<td>

	${
	Number(p.quantity) <= 0
	? "🔴 Нет на складе"
	: Number(p.quantity) <= 10
	? "🟡 Заканчивается"
	: "🟢 В наличии"
	}

	</td>

        <td>

        <button
        class="edit-btn"
        onclick='editProduct("${p.id}",${JSON.stringify(p)})'>
        Изменить
        </button>

        <button
        class="delete-btn"
        onclick='deleteProduct("${p.id}")'>
        Удалить
        </button>

        </td>

        </tr>
        `;

    });

    document.getElementById("productsCount").innerText =
        products.length;

    document.getElementById("stockCount").innerText =
        totalStock;

};

window.onload = async () => {

    await loadCategories();

    await loadSuppliers();

    await loadCategoryFilter();

    loadProducts();

};

</script>

</body>
</html>
