<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store24 - Категории</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    background:linear-gradient(135deg,#2563eb,#1e40af);
    color:white;
    padding:30px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.stat-number{
    font-size:36px;
    font-weight:bold;
    color:#2563eb;
}

input{
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin:5px;
}

button{
    padding:12px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    margin:5px;
}

.add-btn{
    background:#2563eb;
}

.edit-btn{
    background:#f59e0b;
}

.delete-btn{
    background:#dc2626;
}

.back-btn{
    background:#6b7280;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
}

th{
    background:#2563eb;
    color:white;
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    input{
        width:100%;
        margin-bottom:10px;
    }

    button{
        width:100%;
        margin-bottom:10px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>📂 Категории товаров</h1>

<p>Управление категориями магазина</p>

<a href="index.html">
<button class="back-btn">
← На главную
</button>
</a>

</div>

<div class="stats">

<div class="stat-card">
<div class="stat-number" id="categoriesCount">0</div>
<div>Категорий</div>
</div>

</div>

<div class="card">

<h2>Добавление категории</h2>

<input
type="text"
id="categoryName"
placeholder="Название категории"
>

<button
class="add-btn"
onclick="addCategory()">
Добавить категорию
</button>

</div>

<div class="card">

<input
type="text"
id="search"
placeholder="Поиск категории"
onkeyup="loadCategories()"
>

</div>

<div class="card">

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>Название категории</th>
<th>Действия</th>
</tr>
</thead>

<tbody id="categoriesTable">

</tbody>

</table>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
deleteDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbem9e3uL0H5JtbFrM8q_5xK8mz-5VcDI",
  authDomain: "store24-5c657.firebaseapp.com",
  projectId: "store24-5c657",
  storageBucket: "store24-5c657.firebasestorage.app",
  messagingSenderId: "524366256106",
  appId: "1:524366256106:web:2aff7066afabc4ccc58493"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addCategory = async () => {

    const name =
        document.getElementById("categoryName").value;

    if(!name){
        alert("Введите название категории");
        return;
    }

    await addDoc(
        collection(db,"categories"),
        { name }
    );

    document.getElementById("categoryName").value = "";

    loadCategories();

};

window.deleteCategory = async (id) => {

    if(!confirm("Удалить категорию?"))
        return;

    await deleteDoc(
        doc(db,"categories",id)
    );

    loadCategories();

};

window.editCategory = async (id,currentName) => {

    const newName =
        prompt(
            "Название категории",
            currentName
        );

    if(newName===null)
        return;

    await updateDoc(
        doc(db,"categories",id),
        {
            name:newName
        }
    );

    loadCategories();

};

window.loadCategories = async () => {

    const table =
        document.getElementById("categoriesTable");

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    table.innerHTML = "";

    const querySnapshot =
        await getDocs(
            collection(db,"categories")
        );

    const categories = [];

    querySnapshot.forEach((document)=>{

        categories.push({
            id:document.id,
            ...document.data()
        });

    });

    categories.reverse();

    categories.forEach((category)=>{

        if(
            search &&
            !category.name
            .toLowerCase()
            .includes(search)
        ){
            return;
        }

        table.innerHTML += `
        <tr>

        <td>${category.name}</td>

        <td>

        <button
        class="edit-btn"
        onclick='editCategory("${category.id}","${category.name}")'>
        Изменить
        </button>

        <button
        class="delete-btn"
        onclick='deleteCategory("${category.id}")'>
        Удалить
        </button>

        </td>

        </tr>
        `;

    });

    document.getElementById("categoriesCount").innerText =
        categories.length;

};

loadCategories();

</script>

</body>
</html>
