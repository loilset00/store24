<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store24 - Продажи</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1300px;
    margin:auto;
}

.header{
    background:linear-gradient(135deg,#2563eb,#1e40af);
    color:white;
    padding:30px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.stat-number{
    font-size:36px;
    font-weight:bold;
    color:#2563eb;
}

input{
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin:5px;
}

button{
    padding:12px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    margin:5px;
}

.add-btn{
    background:#2563eb;
}

.edit-btn{
    background:#f59e0b;
}

.delete-btn{
    background:#dc2626;
}

.back-btn{
    background:#6b7280;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
}

th{
    background:#2563eb;
    color:white;
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    input{
        width:100%;
        margin-bottom:10px;
    }

    button{
        width:100%;
        margin-bottom:10px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>💰 Продажи</h1>

<p>Учёт реализации товаров</p>

<a href="index.html">
<button class="back-btn">
← На главную
</button>
</a>

</div>

<div class="stats">

<div class="stat-card">
<div class="stat-number" id="salesCount">0</div>
<div>Продаж</div>
</div>

<div class="stat-card">
<div class="stat-number" id="revenue">0 ₽</div>
<div>Выручка</div>
</div>

</div>

<div class="card">

<h2>Добавить продажу</h2>

<select id="product"></select>

<input
type="text"
id="productPrice"
placeholder="Цена"
readonly
>

<input
type="text"
id="productStock"
placeholder="Остаток"
readonly
>

<input
type="number"
id="amount"
placeholder="Количество"
>

<input
type="date"
id="saleDate"
>

<button
class="add-btn"
onclick="addSale()">
Добавить продажу
</button>

</div>

<div class="card">

<input
type="text"
id="search"
placeholder="Поиск товара"
onkeyup="loadSales()"
>

</div>

<div class="card">

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>Товар</th>
<th>Количество</th>
<th>Цена</th>
<th>Сумма</th>
<th>Дата</th>
<th>Действия</th>
</tr>
</thead>

<tbody id="salesTable">

</tbody>

</table>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    deleteDoc,
    updateDoc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBbem9e3uL0H5JtbFrM8q_5xK8mz-5VcDI",
    authDomain: "store24-5c657.firebaseapp.com",
    projectId: "store24-5c657",
    storageBucket: "store24-5c657.firebasestorage.app",
    messagingSenderId: "524366256106",
    appId: "1:524366256106:web:2aff7066afabc4ccc58493"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];

async function loadProductsSelect() {

    const select =
        document.getElementById("product");

    select.innerHTML = "";

    const querySnapshot =
        await getDocs(
            collection(db, "products")
        );

    products = [];

    querySnapshot.forEach((document) => {

        const product = {
            id: document.id,
            ...document.data()
        };

        products.push(product);

        select.innerHTML += `
            <option value="${document.id}">
                ${product.name}
            </option>
        `;
    });

    updateProductInfo();
}

window.updateProductInfo = () => {

    const productId =
        document.getElementById("product").value;

    const product =
        products.find(p => p.id === productId);

    if (!product) return;

    document.getElementById("productPrice").value =
        product.price + " ₽";

    document.getElementById("productStock").value =
        product.quantity + " шт";
};

window.addSale = async () => {

    const productId =
        document.getElementById("product").value;

    const amount =
        Number(
            document.getElementById("amount").value
        );

    const date =
        document.getElementById("saleDate").value;

    const product =
        products.find(p => p.id === productId);

    if (!product) {
        alert("Товар не найден");
        return;
    }

    if (amount <= 0) {
        alert("Введите количество");
        return;
    }

    if (amount > product.quantity) {
        alert("Недостаточно товара на складе");
        return;
    }

    const total =
        amount * product.price;

    await addDoc(
        collection(db, "sales"),
        {
            productId,
            product: product.name,
            amount,
            price: product.price,
            total,
            date
        }
    );

    await updateDoc(
        doc(db, "products", productId),
        {
            quantity:
                product.quantity - amount
        }
    );

    await loadProductsSelect();
    loadSales();

    document.getElementById("amount").value = "";
};

window.deleteSale = async (saleId) => {

    if (!confirm("Удалить продажу?"))
        return;

    const saleRef =
        doc(db, "sales", saleId);

    const saleSnap =
        await getDoc(saleRef);

    if (!saleSnap.exists())
        return;

    const sale =
        saleSnap.data();

    const productRef =
        doc(db, "products", sale.productId);

    const productSnap =
        await getDoc(productRef);

    if (productSnap.exists()) {

        const product =
            productSnap.data();

        await updateDoc(
            productRef,
            {
                quantity:
                    Number(product.quantity) +
                    Number(sale.amount)
            }
        );
    }

    await deleteDoc(saleRef);

    await loadProductsSelect();
    loadSales();
};

window.editSale = async (id, sale) => {

    const newAmount =
        Number(
            prompt(
                "Новое количество",
                sale.amount
            )
        );

    if (!newAmount || newAmount <= 0)
        return;

    const productRef =
        doc(db, "products", sale.productId);

    const productSnap =
        await getDoc(productRef);

    if (!productSnap.exists()) {
        alert("Товар не найден");
        return;
    }

    const product =
        productSnap.data();

    const returnedStock =
        Number(product.quantity) +
        Number(sale.amount);

    if (newAmount > returnedStock) {
        alert("Недостаточно товара");
        return;
    }

    const newTotal =
        newAmount * Number(sale.price);

    await updateDoc(
        productRef,
        {
            quantity:
                returnedStock - newAmount
        }
    );

    await updateDoc(
        doc(db, "sales", id),
        {
            amount: newAmount,
            total: newTotal
        }
    );

    await loadProductsSelect();
    loadSales();
};

window.loadSales = async () => {

    const table =
        document.getElementById("salesTable");

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    table.innerHTML = "";

    let revenue = 0;

    const querySnapshot =
        await getDocs(
            collection(db, "sales")
        );

    const sales = [];

    querySnapshot.forEach((document) => {

        sales.push({
            id: document.id,
            ...document.data()
        });

    });

    sales.reverse();

    sales.forEach((sale) => {

        revenue +=
            Number(sale.total || 0);

        if (
            search &&
            !sale.product
                .toLowerCase()
                .includes(search)
        ) {
            return;
        }

        table.innerHTML += `
        <tr>

            <td>${sale.product}</td>
            <td>${sale.amount}</td>
            <td>${sale.price}</td>
            <td>${sale.total}</td>
            <td>${sale.date}</td>

            <td>

                <button
                class="edit-btn"
                onclick='editSale("${sale.id}", ${JSON.stringify(sale)})'>
                Изменить
                </button>

                <button
                class="delete-btn"
                onclick='deleteSale("${sale.id}")'>
                Удалить
                </button>

            </td>

        </tr>
        `;
    });

    document.getElementById("salesCount").innerText =
        sales.length;

    document.getElementById("revenue").innerText =
        revenue + " ₽";
};

window.onload = async () => {

    await loadProductsSelect();

    document
        .getElementById("product")
        .addEventListener(
            "change",
            updateProductInfo
        );

    loadSales();
};

</script>

</body>
</html>
