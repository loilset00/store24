<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store24 - Продажи</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1300px;
    margin:auto;
}

.header{
    background:linear-gradient(135deg,#2563eb,#1e40af);
    color:white;
    padding:30px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.stat-number{
    font-size:36px;
    font-weight:bold;
    color:#2563eb;
}

input{
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin:5px;
}

button{
    padding:12px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    margin:5px;
}

.add-btn{
    background:#2563eb;
}

.edit-btn{
    background:#f59e0b;
}

.delete-btn{
    background:#dc2626;
}

.back-btn{
    background:#6b7280;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
}

th{
    background:#2563eb;
    color:white;
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    input{
        width:100%;
        margin-bottom:10px;
    }

    button{
        width:100%;
        margin-bottom:10px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>💰 Продажи</h1>

<p>Учёт реализации товаров</p>

<a href="index.html">
<button class="back-btn">
← На главную
</button>
</a>

</div>

<div class="stats">

<div class="stat-card">
<div class="stat-number" id="salesCount">0</div>
<div>Продаж</div>
</div>

<div class="stat-card">
<div class="stat-number" id="revenue">0 ₽</div>
<div>Выручка</div>
</div>

</div>

<div class="card">

<h2>Добавить продажу</h2>

<input
type="text"
id="product"
placeholder="Товар"
>

<input
type="number"
id="amount"
placeholder="Количество"
>

<input
type="number"
id="price"
placeholder="Цена"
>

<input
type="date"
id="saleDate"
>

<button
class="add-btn"
onclick="addSale()">
Добавить продажу
</button>

</div>

<div class="card">

<input
type="text"
id="search"
placeholder="Поиск товара"
onkeyup="loadSales()"
>

</div>

<div class="card">

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>Товар</th>
<th>Количество</th>
<th>Цена</th>
<th>Сумма</th>
<th>Дата</th>
<th>Действия</th>
</tr>
</thead>

<tbody id="salesTable">

</tbody>

</table>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
deleteDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbem9e3uL0H5JtbFrM8q_5xK8mz-5VcDI",
  authDomain: "store24-5c657.firebaseapp.com",
  projectId: "store24-5c657",
  storageBucket: "store24-5c657.firebasestorage.app",
  messagingSenderId: "524366256106",
  appId: "1:524366256106:web:2aff7066afabc4ccc58493"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addSale = async () => {

    const product =
        document.getElementById("product").value;

    const amount =
        Number(document.getElementById("amount").value);

    const price =
        Number(document.getElementById("price").value);

    const date =
        document.getElementById("saleDate").value;

    const total = amount * price;

    await addDoc(
        collection(db,"sales"),
        {
            product,
            amount,
            price,
            total,
            date
        }
    );

    loadSales();

};

window.deleteSale = async (id) => {

    if(!confirm("Удалить продажу?"))
        return;

    await deleteDoc(
        doc(db,"sales",id)
    );

    loadSales();

};

window.editSale = async (id,sale) => {

    const product =
        prompt("Товар",sale.product);

    if(product===null) return;

    const amount =
        prompt("Количество",sale.amount);

    const price =
        prompt("Цена",sale.price);

    const total =
        Number(amount) * Number(price);

    await updateDoc(
        doc(db,"sales",id),
        {
            product,
            amount:Number(amount),
            price:Number(price),
            total
        }
    );

    loadSales();

};

window.loadSales = async () => {

    const table =
        document.getElementById("salesTable");

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    table.innerHTML = "";

    let revenue = 0;

    const querySnapshot =
        await getDocs(
            collection(db,"sales")
        );

    const sales = [];

    querySnapshot.forEach((document)=>{

        sales.push({
            id:document.id,
            ...document.data()
        });

    });

    sales.reverse();

    sales.forEach((sale)=>{

        revenue += Number(sale.total || 0);

        if(
            search &&
            !sale.product
            .toLowerCase()
            .includes(search)
        ){
            return;
        }

        table.innerHTML += `
        <tr>

        <td>${sale.product}</td>
        <td>${sale.amount}</td>
        <td>${sale.price}</td>
        <td>${sale.total}</td>
        <td>${sale.date}</td>

        <td>

        <button
        class="edit-btn"
        onclick='editSale("${sale.id}",${JSON.stringify(sale)})'>
        Изменить
        </button>

        <button
        class="delete-btn"
        onclick='deleteSale("${sale.id}")'>
        Удалить
        </button>

        </td>

        </tr>
        `;

    });

    document.getElementById("salesCount").innerText =
        sales.length;

    document.getElementById("revenue").innerText =
        revenue + " ₽";

};

loadSales();

</script>

</body>
</html>
