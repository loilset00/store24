<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store24 - Поставщики</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:30px;
    margin:0;
}

.container{
    max-width:1100px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
    padding:10px;
    margin:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
    background:#2563eb;
}

.edit-btn{
    background:#f59e0b;
}

.delete-btn{
    background:#dc2626;
}

.back-btn{
    background:#6b7280;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#2563eb;
    color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Поставщики</h1>

<a href="index.html">
<button class="back-btn">
На главную
</button>
</a>

</div>

<div class="card">

<h2>Добавление поставщика</h2>

<input
type="text"
id="supplierName"
placeholder="Название организации"
>

<input
type="text"
id="supplierPhone"
placeholder="Телефон"
>

<button onclick="addSupplier()">
Добавить
</button>

</div>

<div class="card">

<input
type="text"
id="search"
placeholder="Поиск поставщика"
onkeyup="loadSuppliers()"
>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>Название</th>
<th>Телефон</th>
<th>Действия</th>
</tr>
</thead>

<tbody id="suppliersTable">

</tbody>

</table>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
deleteDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbem9e3uL0H5JtbFrM8q_5xK8mz-5VcDI",
  authDomain: "store24-5c657.firebaseapp.com",
  projectId: "store24-5c657",
  storageBucket: "store24-5c657.firebasestorage.app",
  messagingSenderId: "524366256106",
  appId: "1:524366256106:web:2aff7066afabc4ccc58493"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addSupplier = async () => {

    const name =
        document.getElementById("supplierName").value;

    const phone =
        document.getElementById("supplierPhone").value;

    if(!name){
        alert("Введите название поставщика");
        return;
    }

    await addDoc(
        collection(db,"suppliers"),
        {
            name,
            phone
        }
    );

    document.getElementById("supplierName").value = "";
    document.getElementById("supplierPhone").value = "";

    loadSuppliers();

};

window.deleteSupplier = async (id) => {

    if(!confirm("Удалить поставщика?")){
        return;
    }

    await deleteDoc(
        doc(db,"suppliers",id)
    );

    loadSuppliers();

};

window.editSupplier = async (id,currentName) => {

    const newName =
        prompt(
            "Новое название поставщика",
            currentName
        );

    if(!newName){
        return;
    }

    await updateDoc(
        doc(db,"suppliers",id),
        {
            name:newName
        }
    );

    loadSuppliers();

};

window.loadSuppliers = async () => {

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const table =
        document.getElementById("suppliersTable");

    table.innerHTML = "";

    const querySnapshot =
        await getDocs(
            collection(db,"suppliers")
        );

    querySnapshot.forEach((document)=>{

        const supplier =
            document.data();

        if(
            search &&
            !supplier.name
            .toLowerCase()
            .includes(search)
        ){
            return;
        }

        table.innerHTML += `
        <tr>

            <td>${supplier.name}</td>
            <td>${supplier.phone || "-"}</td>

            <td>

                <button
                class="edit-btn"
                onclick="editSupplier('${document.id}','${supplier.name}')">
                Изменить
                </button>

                <button
                class="delete-btn"
                onclick="deleteSupplier('${document.id}')">
                Удалить
                </button>

            </td>

        </tr>
        `;
    });

};

loadSuppliers();

</script>

</body>
</html>
